name: Deploy Backup Runner

# Builds the Neon → local Postgres backup runner image (#323).
#   push to main touching backend/backup/**        → ghcr.io/<owner>/poketeamdex-backup:latest
#   push to any other branch touching it (or manual) → tagged with the branch name, e.g. feat-neon-local-backup

on:
  push:
    paths: ['backend/backup/**', '.github/workflows/deploy-backup.yml']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/poketeamdex-backup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/backup
          file: backend/backup/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
